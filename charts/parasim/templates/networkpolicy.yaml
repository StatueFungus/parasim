{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "parasim.fullname" . }}
  labels:
    {{- include "parasim.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "parasim.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  # Statische Auslieferung: keine ausgehenden Verbindungen nötig
  egress: []
{{- end }}
