# ParaSim: statische Auslieferung durch nginx (unprivilegiert, Port 8080)
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_min_length 512;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # Health-Check für Kubernetes-Probes und Docker
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /version.json {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Dateinamen tragen keinen Hash: Browser prüfen per ETag nach, ob sich etwas geändert hat.
    location / {
        try_files $uri $uri/ =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
