name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, Tests, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Bot-Balance als Zusammenfassung
        run: |
          {
            echo '### Bot-Distanzen (km), Flachland EN-B, 8 Tage'
            echo '```'
            node scripts/balance.mjs flat EN-B 0
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  helm:
    name: Helm-Chart prüfen
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.6.7
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: helm lint
        run: |
          helm lint --strict charts/parasim
          helm lint --strict charts/parasim --set ingress.enabled=true,autoscaling.enabled=true,networkPolicy.enabled=true
      - name: Manifeste gegen Kubernetes-Schemas prüfen
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz kubeconform
          for set in "" "ingress.enabled=true,autoscaling.enabled=true,networkPolicy.enabled=true"; do
            helm template parasim charts/parasim ${set:+--set $set} \
              | ./kubeconform -strict -summary -kubernetes-version 1.30.0 -
          done

  docker:
    name: Image bauen, testen, scannen
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: parasim:ci
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-Test des Containers
        run: |
          docker run -d --name parasim -p 8080:8080 --read-only --tmpfs /tmp parasim:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/ | grep -q '<title>ParaSim'
          curl -fsS http://localhost:8080/js/sim/world.js | grep -q 'export class World'
          curl -fsS http://localhost:8080/version.json
          curl -fsSI http://localhost:8080/ | grep -qi '^content-security-policy:'
          docker logs parasim
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: parasim:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
