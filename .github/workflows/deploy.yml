# Rollout in einen Kubernetes-Cluster: automatisch nach jedem Release (aus CI/CD aufgerufen) oder manuell,
# z. B. für ein Rollback. Inaktiv, bis die Repository-Variable DEPLOY_ENABLED=true gesetzt und im Environment
# «production» das Secret KUBECONFIG (Inhalt einer kubeconfig, base64-kodiert) hinterlegt ist.
name: Deploy

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: 'Version ohne v, z. B. 0.2.0'
        type: string
        required: true

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: helm upgrade (production)
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}
      - uses: azure/setup-helm@v5
      - name: Kubeconfig einrichten
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
      - name: helm upgrade --install
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GH_ACTOR" --password-stdin
          helm upgrade --install parasim "oci://ghcr.io/${OWNER}/charts/parasim" \
            --version "$VERSION" \
            --namespace parasim --create-namespace \
            -f deploy/helm/values-production.yaml \
            --wait --atomic --timeout 5m
          helm test parasim --namespace parasim
