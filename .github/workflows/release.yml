name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verify:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  image:
    name: Container-Image nach GHCR
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            GIT_SHA=${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    name: Helm-Chart nach GHCR
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Chart versionieren, packen und pushen
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY,,}"
          sed -i "s#^\(  repository: \).*#\1ghcr.io/${REPO}#" charts/parasim/values.yaml
          helm package charts/parasim --version "$VERSION" --app-version "$VERSION" --destination .
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GH_ACTOR" --password-stdin
          helm push "parasim-${VERSION}.tgz" "oci://ghcr.io/${OWNER}/charts"
      - uses: actions/upload-artifact@v4
        with:
          name: chart
          path: parasim-*.tgz

  github-release:
    name: GitHub-Release
    needs: [image, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chart
      - name: Installationshinweise
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY,,}"
          cat > notes.md <<NOTES
          ## Installation

          Container:
          \`\`\`sh
          docker run -p 8080:8080 ghcr.io/${REPO}:${VERSION}
          \`\`\`

          Helm:
          \`\`\`sh
          helm install parasim oci://ghcr.io/${OWNER}/charts/parasim --version ${VERSION}
          \`\`\`

          Image-Digest: \`${{ needs.image.outputs.digest }}\`
          NOTES
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          generate_release_notes: true
          files: parasim-*.tgz
